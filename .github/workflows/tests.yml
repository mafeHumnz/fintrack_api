name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: fintrack
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://usuario:admin@localhost:5433/fintrack
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: 3000

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://usuario:admin@localhost:5433/fintrack
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: 3000
